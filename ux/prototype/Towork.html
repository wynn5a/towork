<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Towork</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body>

  <!-- window chrome (Tauri desktop) -->
  <div class="titlebar">
    <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="tb-title">Towork — wmai-top</div>
    <div class="tb-spacer"></div>
  </div>

  <div class="shell">

    <!-- ============ Sidebar ============ -->
    <aside class="sidebar">
      <div class="side-head">
        <span class="ws-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M4 12h16M4 17h7"/></svg>
        </span>
        <span class="ws-name">Towork<span class="sub">wmai-top</span></span>
        <button class="icon-btn" id="side-compose" title="New (N)" style="margin-left:auto">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
      </div>

      <div class="side-nav">
        <div class="nav-item" data-nav="todos">
          <span class="ni-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></svg></span>
          <span class="ni-label">Todos</span>
        </div>
        <div class="nav-item" data-nav="home">
          <span class="ni-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg></span>
          <span class="ni-label">Projects</span>
        </div>
        <div class="nav-item" id="side-cmdk">
          <span class="ni-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6a3 3 0 1 1 3 3h-3V6ZM9 6a3 3 0 1 0-3 3h3V6ZM9 18a3 3 0 1 1-3-3h3v3ZM15 18a3 3 0 1 0 3-3h-3v3Z"/></svg></span>
          <span class="ni-label">Command</span>
          <span class="kbd">⌘K</span>
        </div>
      </div>

      <div class="side-grouplabel">
        Projects
        <button class="add" id="side-new-proj" title="New project">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="proj-list" id="proj-list"></div>

      <div class="side-foot">
        <span class="mcp-dot"></span>
        <span class="mcp-txt"><b>Claude</b> connected <span class="mono">· via MCP</span></span>
      </div>
    </aside>

    <!-- ============ Main ============ -->
    <main class="main">
      <div class="main-scroll" id="main-scroll"></div>
    </main>

  </div>

  <!-- overlays -->
  <div class="overlay" id="overlay"></div>
  <div class="palette-overlay" id="palette-overlay">
    <div class="palette" role="dialog" aria-modal="true">
      <div class="pq">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="pal-input" placeholder="Type a command or search…" />
        <span class="kbd">esc</span>
      </div>
      <div class="pbody" id="pal-body"></div>
    </div>
  </div>
  <div class="menu" id="ctx-menu"></div>
  <div class="toast-wrap" id="toast-wrap"></div>
  <div id="tweaks-root"></div>

  <script src="app.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="tweaks-app.jsx"></script>
</body>
</html>
